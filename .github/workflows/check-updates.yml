name: Check Peer Platform Updates

on:
  schedule:
    # Every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update checker
        id: check
        run: |
          OUTPUT=$(./check-updates.sh --verbose 2>&1) || true
          echo "$OUTPUT"
          # Capture output for issue body
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # Set exit code
          if echo "$OUTPUT" | grep -q "No changes detected"; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue if changes detected
        if: steps.check.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.check.outputs.output }}`;

            // Check if there's already an open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'peer-update'
            });

            if (issues.data.length > 0) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `## Weekly check — ${new Date().toISOString().split('T')[0]}\n\n\`\`\`\n${output}\n\`\`\``
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Peer platform update detected — ${new Date().toISOString().split('T')[0]}`,
                body: `The weekly update checker found changes in the Peer platform that may require updating the skill.\n\n\`\`\`\n${output}\n\`\`\`\n\n## Next steps\n\n1. Run \`coteja peer con la web\` in Claude Code\n2. Apply necessary updates\n3. Close this issue when done`,
                labels: ['peer-update']
              });
            }
